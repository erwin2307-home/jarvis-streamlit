[project]
name = "jarvis"
version = "0.1.0"
description = "Offline voice assistant with Reactor Core HUD"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pydantic>=2.9",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "openwakeword>=0.6",
  "silero-vad>=5.1",
  "faster-whisper>=1.0",
  "ollama>=0.4",
  "piper-tts>=1.2",
  "loguru>=0.7",
  "httpx>=0.27",
  "edge-tts>=7.3.1",
  "soundfile>=0.12",
  "scipy>=1.13",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
